[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zip-preflight"
version = "0.2.0"
description = "Check ZIP archives for filename portability and extraction hazards without extracting them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hhhxsss"}]
keywords = ["zip", "portability", "archive", "lint", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Hhhxsss/zip-preflight"
Issues = "https://github.com/Hhhxsss/zip-preflight/issues"
Documentation = "https://github.com/Hhhxsss/zip-preflight/tree/main/docs"

[project.scripts]
zip-preflight = "zip_preflight.cli:main"

[project.gui-scripts]
zip-preflight-gui = "zip_preflight.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zip_preflight = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".local", ".tools", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
